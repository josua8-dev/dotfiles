# GENERATED by scripts/theme_manager.py on every palette change.
# Read by yazi as `[flavor] dark = "impasto"`; edits here are lost at
# the next theme switch, and yazi has to be reopened to see it.
#
# Backgrounds are set only where something has to sit on one, so the
# blurred desktop under the terminal comes through everywhere else.

[mgr]
cwd = { fg = "#b5b5b5", bold = true }

find_keyword = { fg = "#a3945f", bold = true, underline = true }
find_position = { fg = "#555555", bold = true, italic = true }
symlink_target = { fg = "#dadada", italic = true }

marker_copied = { fg = "#7a9774", bg = "#7a9774" }
marker_cut = { fg = "#ac8585", bg = "#ac8585" }
marker_marked = { fg = "#757575", bg = "#757575" }
marker_selected = { fg = "#b5b5b5", bg = "#b5b5b5" }

count_copied = { fg = "#272727", bg = "#7a9774" }
count_cut = { fg = "#272727", bg = "#ac8585" }
count_selected = { fg = "#121212", bg = "#b5b5b5" }

border_symbol = "│"
border_style = { fg = "#303030" }

# The cursor, in both panes: the ground lifted, and towards the accent
# where the cursor actually is.
[indicator]
current = { bg = "#5f5f5f" }
parent = { bg = "#333333" }
preview = { underline = true }

[tabs]
active = { fg = "#d6d6d6", bg = "#3f3f3f", bold = true }
inactive = { fg = "#9d9d9d", bg = "#333333" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#d6d6d6", bg = "#3f3f3f", bold = true }
normal_alt = { fg = "#9d9d9d", bg = "#333333" }

select_main = { fg = "#121212", bg = "#b5b5b5", bold = true }
select_alt = { fg = "#b5b5b5", bg = "#5f5f5f" }

unset_main = { fg = "#272727", bg = "#a3945f", bold = true }
unset_alt = { fg = "#a3945f", bg = "#58523d" }

[status]
overall = { fg = "#d6d6d6" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep = { fg = "#555555" }
perm_type = { fg = "#7e90ac" }
perm_read = { fg = "#a3945f" }
perm_write = { fg = "#ac8585" }
perm_exec = { fg = "#7a9774" }

progress_label = { fg = "#dbdbdb", bold = true }
progress_normal = { fg = "#b5b5b5", bg = "#5f5f5f" }
progress_error = { fg = "#272727", bg = "#ac8585" }

[which]
border = { fg = "#303030" }
cols = 3
mask = { bg = "#333333" }
cand = { fg = "#b5b5b5", bold = true }
rest = { fg = "#8e8e8e" }
desc = { fg = "#555555", italic = true }
separator_style = { fg = "#303030" }

[confirm]
border = { fg = "#303030" }
title = { fg = "#b5b5b5", bold = true }
body = { fg = "#d6d6d6" }
list = { fg = "#8e8e8e" }
btn_yes = { fg = "#121212", bg = "#b5b5b5", bold = true }
btn_no = { fg = "#9d9d9d", bg = "#333333" }

[spot]
border = { fg = "#303030" }
title = { fg = "#b5b5b5", bold = true }
tbl_col = { fg = "#8e8e8e" }
tbl_cell = { bg = "#333333" }

[notify]
title_info = { fg = "#7e90ac" }
title_warn = { fg = "#a3945f" }
title_error = { fg = "#ac8585" }

[pick]
border = { fg = "#303030" }
active = { fg = "#b5b5b5", bold = true }
inactive = { fg = "#8e8e8e" }

[input]
border = { fg = "#303030" }
title = { fg = "#b5b5b5", bold = true }
value = { fg = "#d6d6d6" }
selected = { bg = "#333333" }

[cmp]
border = { fg = "#303030" }
active = { fg = "#d6d6d6", bg = "#333333" }
inactive = { fg = "#8e8e8e" }

[tasks]
border = { fg = "#303030" }
title = { fg = "#b5b5b5", bold = true }
hovered = { fg = "#b5b5b5", bold = true }

[help]
border = { fg = "#303030" }
chord = { fg = "#b5b5b5" }
action = { fg = "#d6d6d6" }
hovered = { bg = "#333333", bold = true }

# The mime patterns are yazi's own shape — `**/` and a brace list — and
# not the bare `image/*` an older flavour would use, which matches
# nothing here and says nothing about it.
[filetype]
rules = [
  { mime = "**/image/*", fg = "#d9d9d9" },
  { mime = "**/{audio,video}/*", fg = "#dfdac9" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e3d6d6" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#d4dae3" },

  { mime = "vfs/{absent,stale}", fg = "#555555", crossed = true },
  { url = "*", is = "orphan", fg = "#555555", crossed = true },
  { url = "*", is = "dummy", fg = "#555555", crossed = true },
  { url = "*/", is = "dummy", fg = "#555555", crossed = true },
  { url = "*", is = "exec", fg = "#d2dcd0" },

  { url = "*", fg = "#dadada" },
  { url = "*/", fg = "#dbdbdb" }
]
